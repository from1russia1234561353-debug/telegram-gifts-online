const HS={on:0,rid:'',phase:'wait',t0:0,cr:1,startAt:0,nextAt:0,next:0,paused:0,bets:{},done:{},res:[],log:[],top:{},hist:[],tm:0,hb:0,unb:null,mm:1,q:[],lo:0,hi:0};
async function hostStart(silent){
 if(HS.on)return;if(CK.fs&&!(CK.owner&&CR.on))return toast('Нужен вход создателя через Google');
 try{const l=await RDB().doc('rocket/log').get();HS.log=l.exists?(l.data().items||[]):[];const t=await RDB().doc('rocket/top').get();HS.top=t.exists?(t.data().t||{}):{};const s=await RDB().doc('rocket/state').get();HS.hist=s.exists?(s.data().hist||[]):[]}catch(e){}
 HS.on=1;HS.paused=0;
 if(RDB()===LDB&&!HS.seeded){HS.seeded=1;BN.forEach((n,i)=>{LDB.doc('leaders/bot'+i).set({nick:n,worth:Math.round(20000+Math.random()*1500000),top:showKey(rnd(GF.length),i),ts:Date.now()})})}
 hostRound();HS.tm=setInterval(hostTick,100);if(!silent){toast('Сервер ракеты запущен');crRocket()}}
function hostStop(silent){clearInterval(HS.tm);HS.on=0;if(HS.unb){try{HS.unb()}catch(e){}HS.unb=null}HS.phase='off';hostPub({phase:'off'});if(!silent){toast('Сервер остановлен');crRocket()}}
function hostPub(x){const now=Date.now();return RDB().doc('rocket/state').set(Object.assign({rid:HS.rid,phase:HS.phase,t0:HS.t0,startAt:HS.startAt,hist:HS.hist,paused:HS.paused?1:0,ts:now,now},x||{})).catch(()=>{})}
function hostRound(){
 HS.rid='r'+Date.now().toString(36);HS.phase='wait';HS.bets={};HS.done={};HS.res=[];HS.startAt=Date.now()+(RDB()===LDB?9000:12000);HS.cr=0;HS.t0=0;
 if(HS.unb){try{HS.unb()}catch(e){}}
 HS.unb=RDB().watch('rbets','rid',HS.rid,list=>{HS.bets={};list.forEach(x=>HS.bets[x.id]=x.data)},()=>{});
 HS.hb=Date.now();if(RDB()===LDB)botsPlan();hostPub()}
const cx=v=>Math.min(1000,Math.max(1,Math.round(v*100)/100));
function hostFly(){HS.phase='fly';HS.t0=Date.now();HS.cr=HS.next?cx(HS.next):HS.q.length?cx(HS.q.shift()):HS.hi>HS.lo&&HS.lo>=1?cx(HS.lo+Math.random()*(HS.hi-HS.lo)):crashPt();HS.next=0;hostPub()}
async function hostGive(who,items,id){const its=items.map((it,i)=>({...it,id:id+'-'+i}));
 if(RDB()===LDB){if(who==nick)applyGifts({exists:true,data:()=>({items:its})});return}
 const ref=CK.db.doc('gifts/'+nh(who));try{const sn=await ref.get(),old=sn.exists?(sn.data().items||[]):[];await ref.set({items:[...old.slice(-199),...its]})}catch(e){}}
function hostSettle(id,b,m){
 HS.done[id]=1;const fm=Math.floor(m*100)/100,items=[],note='Ракета '+X(fm);let prize,w;
 if(b.cur=='t'){const V=+(b.v*fm).toFixed(4);items.push({t:'ton',v:V,note});prize=fmtT(V);w=Math.round(V*TR)}
 else{const V=Math.floor(b.v*fm),pz=prizeFor(V);if(pz.d)items.push({t:'num',d:pz.d,note});if(pz.rest>0)items.push({t:'money',v:pz.rest,note});if(!items.length)items.push({t:'money',v:V,note});prize=pz.d?show(pz.d)+(pz.rest?` + ${fmt(pz.rest)}`:''):fmt(V);w=V}
 hostGive(b.nick,items,'r'+id);
 HS.res.push({nick:b.nick,s:b.kind=='g'?show(b.d):(b.cur=='t'?fmtT(b.v):fmt(b.v)),sv:b.cur=='t'?Math.round(b.v*TR):b.v,m:fm,w,p:prize})}
function hostCrash(){
 HS.phase='crash';const cr=Math.max(1,Math.floor(HS.cr*100)/100),now=Date.now();
 for(const [id,b] of Object.entries(HS.bets))if(!HS.done[id]){HS.done[id]=1;HS.res.push({nick:b.nick,s:b.kind=='g'?show(b.d):(b.cur=='t'?fmtT(b.v):fmt(b.v)),sv:b.cur=='t'?Math.round(b.v*TR):b.v,m:0,w:0,p:'—'})}
 HS.hist=[cr,...HS.hist].slice(0,14);HS.nextAt=now+6000;HS.cr=cr;
 HS.log=[...HS.res.map(r=>({...r,rid:HS.rid,ts:now})),...HS.log].slice(0,80);
 for(const r of HS.res){const t=HS.top[r.nick]||(HS.top[r.nick]={won:0,bets:0,wins:0});t.bets++;if(r.w){t.wins++;t.won+=r.w}}
 hostPub({cr});RDB().doc('rocket/log').set({items:HS.log}).catch(()=>{});RDB().doc('rocket/top').set({t:HS.top}).catch(()=>{})}
function hostTick(){
 if(!HS.on)return;const now=Date.now();if(now-HS.hb>15000){HS.hb=now;hostPub()}
 if(HS.phase=='wait'){if(!HS.paused&&now>=HS.startAt)hostFly()}
 else if(HS.phase=='fly'){
  const m=mAt((now-HS.t0)/1000);HS.mm=m;if(m>=HS.cr)return hostCrash();
  if(HS.bots)for(const x of HS.bots){if(!x.c&&m>=x.tx){x.c=1;x.b.cash=true;LDB.doc('rbets/'+x.id).set(x.b)}}
  for(const [id,b] of Object.entries(HS.bets))if(b.cash&&!HS.done[id])hostSettle(id,b,m)}
 else if(HS.phase=='crash'){if(!HS.paused&&now>=HS.nextAt)hostRound()}}
function hostBoom(){if(HS.phase=='fly'){HS.cr=Math.max(1,mAt((Date.now()-HS.t0)/1000));toast('Ракета взрывается')}else if(HS.phase=='wait'){HS.next=1;toast('Раунд взорвётся сразу после старта (x1,00)')}else toast('Раунд уже закончился')}
function hostSetX(x){if(!(x>=1))return toast('Введи икс от 1');if(HS.phase=='fly'){HS.cr=cx(x);toast('Взрыв текущего раунда: '+X(HS.cr))}else{HS.next=cx(x);toast('Следующий раунд взорвётся на '+X(HS.next))}hsUI()}
function hostNext(x){if(!(x>=1))return toast('Введи икс от 1');HS.next=cx(x);toast('Следующий взрыв: '+X(HS.next));hsUI()}
function hostQueue(){const L=((($('#hq')||{}).value)||'').split(/[;, ]+/).map(v=>parseFloat(v.replace(',','.'))).filter(v=>v>=1);if(!L.length)return toast('Введи иксы через запятую');HS.q=L.map(cx);toast('Очередь: '+HS.q.map(X).join(', '));hsUI()}

function hostClear(){HS.next=0;HS.q=[];HS.lo=0;HS.hi=0;toast('Иксы снова случайные');hsUI()}

/* ---- гость и ежедневный бесплатный кейс ---- */
function guestLogin(){
 S=NEW();S.bal=GUEST_BAL;GUEST=1;nick='Гость';
 U={srcs:[],stars:0,tgt:null,list:[]};Object.assign(MN,{on:0,end:0,open:[],mine:[]});R.state='idle';render();mlWatch()}
/* шансы в процентах, в сумме ровно 100: ничего 70, 1 ⭐ 25, 5 ⭐ 3,5, 10 ⭐ 1,4999999, 25 ⭐ 0,0000001 */
const DQ=[[0,70,'Ничего','70%'],[1,25,'1 ⭐','25%'],[5,3.5,'5 ⭐','3,5%'],[10,1.4999999,'10 ⭐','1,4999999%'],[25,0.0000001,'25 ⭐','0,0000001%']];
const hms=r=>[Math.floor(r/3600),Math.floor(r%3600/60),r%60].map(x=>String(x).padStart(2,'0')).join(':');
const dcLeft=()=>Math.ceil(((S.dc||0)-Date.now())/1000);
const dcLbl=()=>{const r=dcLeft();return r>0?`Следующий через ${hms(r)}`:'Открыть бесплатно'};
function dailyHtml(){return `<div class="daily">${caseBox(0).replace(/ry0/g,'ryd').replace(/gl0/g,'gld')}<h3>🎁 Ежедневный кейс</h3><p class="mut" style="margin:0">Бесплатно, один раз в 24 часа. Выпадают звёзды ⭐, что именно — сюрприз.</p><button class="btn" id="dcb" data-a="daily"${dcLeft()>0?' disabled':''}>${dcLbl()}</button>${GUEST?'<p class="mut" style="margin:0;font-size:.76rem">Гость: результат не сохраняется.</p>':''}</div>`}
function dailyTick(){const b=$('#dcb');if(!b)return;b.disabled=dcLeft()>0||!!busy;b.textContent=dcLbl()}
setInterval(dailyTick,1000);
const DE=['💨','⭐','🌟','💫','🌠'];
function openDaily(){
 if(busy)return;if(dcLeft()>0)return toast('Ещё рано: кейс откроется через '+hms(dcLeft()));
 let r=Math.random()*100,wi=DQ.length-1;for(let k=0;k<DQ.length;k++){if(r<DQ[k][1]){wi=k;break}r-=DQ[k][1]}
 const n=DQ[wi][0];
 busy=1;S.dc=Date.now()+864e5;if(n)S.bal+=n;save();dailyTick();
 let done=0,tm=0;
 const fin=()=>{if(done)return;done=1;clearTimeout(tm);SK=null;busy=0;render();modal(`<h2>${n?'Выпало '+fmt(n):'Ничего не выпало'}</h2><div class="art" style="height:110px;font-size:3.4rem;--a:#3a2a00;--b:#17171b">${DE[wi]}</div><p class="mut">Следующий кейс через 24 часа.${GUEST?' Гость: результат не сохраняется.':''}</p><button class="btn" data-a="close">Ок</button>`)};
 if(S.fast)return fin();
 const tile=k=>`<div class="mini" style="--c:var(--r${k})"><div class="dct">${DE[k]}</div><b>${DQ[k][2]}</b></div>`;
 const row=[];for(let k=0;k<44;k++)row.push(k==38?wi:rnd(DQ.length));
 modal(`<h2>Ежедневный кейс</h2><div class="strip"><div class="track" id="trk"></div><i class="mark"></i></div><p class="mut">Открываем…</p><button class="btn g sm" data-a="skip">Пропустить</button>`);
 const w=$('.strip').clientWidth,off=38*112+52+rnd(60)-30-w/2,trk=$('#trk'),t0=performance.now(),cnt=Math.ceil(w/112)+3;let fi=-1;
 const frame=now=>{if(done||!$('#trk'))return;const q=Math.min(1,(now-t0)/5000),x=off*(1-Math.pow(1-q,4)),first=Math.max(0,Math.floor(x/112));
  if(first!==fi){fi=first;trk.innerHTML=row.slice(first,first+cnt).map(tile).join('')}
  trk.style.transform=`translate3d(${-(x-first*112)}px,0,0)`;if(q<1)requestAnimationFrame(frame)};
 requestAnimationFrame(frame);
 tm=setTimeout(fin,5250);SK=fin}
/* ---- Online backend: accounts, cloud saves, leaderboard ---- */
const API_BASE='';
const apiToken=()=>lsGet('giftgame:token')||'';
async function apiReq(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(apiToken())headers.Authorization='Bearer '+apiToken();const r=await fetch(API_BASE+path,{...opts,headers});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
let apiSaveTimer=0,apiSaving=false;
function apiSaveSoon(){if(!apiToken()||GUEST)return;clearTimeout(apiSaveTimer);apiSaveTimer=setTimeout(apiSaveNow,700)}
async function apiSaveNow(){if(!apiToken()||GUEST||!nick)return;try{await apiReq('/api/state',{method:'PUT',body:JSON.stringify({state:S})})}catch(e){console.warn('Cloud save failed',e.message)}}
async function apiLoadState(){try{const d=await apiReq('/api/state');if(d.state&&d.state.inv){S=Object.assign(NEW(),d.state);S.inv=(S.inv||[]).filter(i=>ok(i.d));persist();render()}}catch(e){toast('Не удалось загрузить облачное сохранение: '+e.message)}}
async function authSubmit(){const g=id=>(($(id)||{}).value||'').trim(),email=g('#ae').toLowerCase(),password=(($('#ap2')||{}).value||''),requestedNick=g('#nn').replace(/\s+/g,' ');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Введи корректную почту');if(password.length<8)return toast('Пароль должен быть не короче 8 символов');try{let d;try{d=await apiReq('/api/auth/login',{method:'POST',body:JSON.stringify({email,password})})}catch(e){if(!requestedNick)throw new Error('Аккаунт не найден. Для регистрации введи ник.');d=await apiReq('/api/auth/register',{method:'POST',body:JSON.stringify({email,password,nick:requestedNick})})}lsSet('giftgame:token',d.token);lsSet('nu6:last',d.user.nick);login(d.user.nick);await apiLoadState();toast('Вход выполнен — облачное сохранение включено')}catch(e){toast(e.message||'Не удалось войти')}}
function logout(){if(busy||R.on||MN.on||PL.balls.length)return toast('Сначала закончи игру');apiSaveNow();lsSet('giftgame:token','');lsSet('nu6:last','');onStop();nick=null;GUEST=0;render()}
function leaderboardUI(){modal(`<h2>🏆 Таблица лидеров</h2><p class="mut">Общий рейтинг всех аккаунтов. Обновляется при сохранении прогресса.</p><div id="lbrows" class="box">Загрузка…</div><button class="btn g" data-a="lbrefresh">Обновить</button><button class="btn" data-a="close">Закрыть</button>`);loadLeaderboard()}
async function loadLeaderboard(){const el=$('#lbrows');if(!el)return;try{const d=await apiReq('/api/leaderboard');el.innerHTML=d.entries.length?`<div style="display:grid;gap:8px">${d.entries.map((x,i)=>`<div style="display:flex;gap:10px;align-items:center;padding:9px;border-bottom:1px solid var(--bd)"><b style="min-width:28px;color:var(--acc)">#${i+1}</b><span style="flex:1">${esc(x.nick)}</span><b>${Number(x.score).toLocaleString('ru-RU')} ⭐</b></div>`).join('')}</div>`:'Пока нет игроков в рейтинге'}catch(e){el.textContent='Ошибка загрузки: '+e.message}}

(async()=>{if(apiToken()){try{const d=await apiReq('/api/auth/me');login(d.user.nick);await apiLoadState();return}catch(e){lsSet('giftgame:token','')}}render()})();
</script></body></html>
